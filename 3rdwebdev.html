<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = "vikas";
        let last = "chaudhary";
        let upperName = name.toUpperCase();
        let lowerLast = last.toLowerCase();
        let firstChar = name.charAt(0);

        console.log(upperName);
        document.body.innerHTML = upperName + " " + lowerLast + " (First char: " + firstChar + ")";
    </script>
</body>
</html>
